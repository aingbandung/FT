name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure google-services.json is present
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app
          mkdir -p app/src/debug
          python3 - << 'EOF'
          import os, base64, json, shutil

          raw = os.environ.get("GOOGLE_SERVICES_JSON", "").strip()
          target = "app/google-services.json"
          debug_target = "app/src/debug/google-services.json"
          applied = False

          # 1. Try raw JSON from secret
          if raw:
              try:
                  data = json.loads(raw)
                  with open(target, "w", encoding="utf-8") as f:
                      json.dump(data, f, indent=2)
                  print("Applied google-services.json from raw JSON secret.")
                  applied = True
              except Exception:
                  pass

          # 2. Try base64 from secret
          if raw and not applied:
              try:
                  cleaned = "".join(raw.split())
                  missing_padding = len(cleaned) % 4
                  if missing_padding:
                      cleaned += "=" * (4 - missing_padding)
                  decoded = base64.b64decode(cleaned).decode("utf-8")
                  data = json.loads(decoded)
                  with open(target, "w", encoding="utf-8") as f:
                      json.dump(data, f, indent=2)
                  print("Applied google-services.json from base64 secret.")
                  applied = True
              except Exception as e:
                  print(f"Could not parse secret as base64 ({e}).")

          # 3. Fallback: If not applied and file missing or empty, generate valid template
          if not applied:
              if os.path.exists(target) and os.path.getsize(target) > 50:
                  print("Using existing repository app/google-services.json.")
              else:
                  print("Generating default template app/google-services.json...")
                  default_config = {
                      "project_info": {
                          "project_number": "123456789012",
                          "project_id": "family-locator-mock",
                          "storage_bucket": "family-locator-mock.appspot.com"
                      },
                      "client": [
                          {
                              "client_info": {
                                  "mobilesdk_app_id": "1:123456789012:android:abcdef0123456789",
                                  "android_client_info": {
                                      "package_name": "com.example.familylocator"
                                  }
                              },
                              "oauth_client": [],
                              "api_key": [{"current_key": "AIzaSyMockKeyForBuildingApk123456789"}],
                              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
                          }
                      ],
                      "configuration_version": "1"
                  }
                  with open(target, "w", encoding="utf-8") as f:
                      json.dump(default_config, f, indent=2)
                  print("Generated default app/google-services.json.")

          # Mirror to debug directory searched by Google Services plugin
          shutil.copyfile(target, debug_target)
          print(f"Verified: {target} (size: {os.path.getsize(target)} bytes)")
          print(f"Verified: {debug_target} (size: {os.path.getsize(debug_target)} bytes)")
          EOF

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyLocator-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Attach APK to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
